<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HoopLoopSim Alpha 0.7 Verification</title>
  <style>body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f3;color:#111;margin:0;padding:40px 18px}.card{max-width:900px;margin:auto;background:#fff;border:1px solid #ddd;border-radius:22px;padding:28px;box-shadow:0 12px 36px rgba(0,0,0,.06)}.check{padding:14px;margin:9px 0;border-radius:12px;background:#f2f3f5;font-weight:750}.pass{background:#eaf7ee;color:#146b34}.fail{background:#fff0ed;color:#9d2418}a{color:#e64810;font-weight:800}.sub{color:#686868;line-height:1.55}</style>
</head>
<body><main class="card"><p>HOOPLOOP · HOOPLOOPSIM</p><h1>Alpha 0.7 verification</h1><p class="sub">Checks the +5 displayed overall model, save migration hooks, 80 domestic teams, 48 international teams, full-screen tournament UI, semifinal-loser Bronze game, and tournament box-score support.</p><div id="checks">Checking files…</div><p><a href="hooploopsim.html">Open HoopLoopSim</a></p></main>
<script src="hoopsim-teams.js?v=0.7.0"></script>
<script>
(async()=>{
 const checks=[];const add=(name,ok,detail)=>checks.push([name,Boolean(ok),detail]);
 add('Domestic team database',Array.isArray(window.HOOPSIM_TEAMS)&&window.HOOPSIM_TEAMS.length===80,`${window.HOOPSIM_TEAMS?.length||0} of 80 teams loaded`);
 add('International tournament database',Array.isArray(window.HOOPLOOPSIM_TOURNAMENT_TEAMS)&&window.HOOPLOOPSIM_TOURNAMENT_TEAMS.length===48,`${window.HOOPLOOPSIM_TOURNAMENT_TEAMS?.length||0} of 48 teams loaded`);
 add('Removed teams',!window.HOOPLOOPSIM_TOURNAMENT_TEAMS?.some(t=>['Madagascar','New Zealand'].includes(t.country)),'Madagascar and New Zealand remain excluded');
 for(const file of ['hoopsim.css','hoopsim.js','hooploopsim.html','hoopsim.html','version.json']){try{const response=await fetch(`${file}?v=0.7.0`);add(file,response.ok,response.ok?'Available':`HTTP ${response.status}`)}catch(error){add(file,false,error.message)}}
 try{const html=await(await fetch('hooploopsim.html?v=0.7.0')).text();add('Creator copy',html.includes('Build without a box.')&&!html.includes('Overall is the true average of all 15 ratings'),'Outdated true-average sentence removed');add('Full-screen tournament UI',html.includes('international-tournament-shell')&&html.includes('data-international-tab="bracket"')&&html.includes('international-player-stats'),'Dedicated tournament tabs and stats UI found')}catch(error){add('Tournament interface',false,error.message)}
 try{const script=await(await fetch('hoopsim.js?v=0.7.0')).text();add('Alpha 0.7 game logic',script.includes("const VERSION = '0.7.0'")&&script.includes('OVERALL_DISPLAY_BOOST = 5'),'Version and +5 display boost found');add('Rating-model migration',script.includes("RATING_MODEL = 'attribute-average-plus-5'")&&script.includes('ratingModelMigratedFrom'),'Existing-save migration hook found');add('Tournament schedule',script.includes('round<15')&&script.includes('nextSeason=currentCareer.league.season+3')&&script.includes("stage:'round12'")&&script.includes("'Gold Medal Game'")&&script.includes("'Bronze Medal Game'"),'15-game group phase, recurrence, top-12 bracket, and medal games found');add('Bronze medal logic',script.includes('const semifinalLosers=finished.map')&&script.includes('semifinalLosers[0],semifinalLosers[1]'),'Bronze game uses the two semifinal losers');add('International box scores',script.includes('simulateInternationalFullBoxMatch')&&script.includes('data-international-box-score')&&script.includes('openInternationalBoxScore'),'User group games and knockout box-score paths found')}catch(error){add('Alpha 0.7 game logic',false,error.message)}
 document.querySelector('#checks').innerHTML=checks.map(([name,ok,detail])=>`<div class="check ${ok?'pass':'fail'}">${ok?'✓':'✕'} ${name}: ${detail}</div>`).join('');
})()
</script></body></html>
