<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HoopSim Alpha 0.3 Verification</title>
<style>body{font-family:system-ui,sans-serif;background:#f5f5f3;color:#111;margin:0;padding:40px}.card{max-width:760px;margin:auto;background:#fff;border:1px solid #ddd;border-radius:22px;padding:28px}.check{padding:14px;margin:9px 0;border-radius:12px;background:#f2f3f5;font-weight:750}.pass{background:#eaf7ee;color:#146b34}.fail{background:#fff0ed;color:#9d2418}a{color:#e64810}</style></head>
<body><main class="card"><p>HOOPLOOP · HOOPSIM</p><h1>Alpha 0.3 verification</h1><div id="checks">Checking files…</div><p><a href="hoopsim.html">Open HoopSim</a></p></main>
<script src="hoopsim-teams.js?v=0.3.0"></script><script>
(async()=>{const checks=[];checks.push(['Team database',Array.isArray(window.HOOPSIM_TEAMS)&&window.HOOPSIM_TEAMS.length===80,`${window.HOOPSIM_TEAMS?.length||0} of 80 teams loaded`]);for(const file of ['hoopsim.css','hoopsim.js','hoopsim.html']){try{const response=await fetch(`${file}?v=0.3.0`);checks.push([file,response.ok,response.ok?'Available':`HTTP ${response.status}`])}catch(error){checks.push([file,false,error.message])}}try{const html=await (await fetch('hoopsim.html?v=0.3.0')).text();checks.push(['Alpha 0.3 interface',html.includes('manual-draft-button')&&html.includes('player-profile-dialog')&&html.includes('playoff-game-log')&&html.includes('career-hof-outlook'),'Manual draft, profiles, playoff log, and Hall outlook found']);}catch(error){checks.push(['Alpha 0.3 interface',false,error.message])}try{const script=await (await fetch('hoopsim.js?v=0.3.0')).text();checks.push(['Alpha 0.3 game logic',script.includes("const VERSION = '0.3.0'")&&script.includes('EASTER_EGG_NAMES')&&script.includes('simNextPlayoffGame'),'Version, easter eggs, and playoff logic found']);}catch(error){checks.push(['Alpha 0.3 game logic',false,error.message])}document.querySelector('#checks').innerHTML=checks.map(([name,ok,detail])=>`<div class="check ${ok?'pass':'fail'}">${ok?'✓':'✕'} ${name}: ${detail}</div>`).join('')})()
</script></body></html>
