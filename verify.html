<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HoopLoop Platform 23 Verification</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#111;background:#f3f1ec}*{box-sizing:border-box}body{margin:0;padding:32px}main{max-width:940px;margin:auto;background:#fff;padding:32px;border-radius:22px;box-shadow:0 22px 70px #0001}h1{font-size:clamp(2.5rem,8vw,5rem);margin:0 0 8px;text-transform:uppercase}.sub{color:#666;line-height:1.6}.check{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:16px 0;border-top:1px solid #ddd}.icon{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;font-weight:900}.pending .icon{background:#eee}.pass .icon{color:#fff;background:#18864c}.fail .icon{color:#fff;background:#bd3328}.check strong,.check small{display:block}.check small{margin-top:4px;color:#666;line-height:1.45}a{color:#df4c15;font-weight:800}button{padding:12px 16px;border:0;border-radius:9px;background:#ff5a1f;color:#fff;font-weight:900;cursor:pointer}.links{display:flex;gap:16px;flex-wrap:wrap;align-items:center}</style></head><body><main><h1>Platform 23 Check</h1><p class="sub">Checks Pack, Pull, Play v2 while preserving the existing Cash Grab, Stats Race and PPP online backends.</p><div id="checks"></div><p class="links"><button id="rerun">Run checks again</button><a href="pack-pull-play.html">Pack, Pull, Play</a><a href="cash-grab.html">Cash Grab</a><a href="stats-race.html">Stats Race</a><a href="index.html">Home</a></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="cash-grab-data.js?v=7.2.0"></script><script src="cash-grab-real-data.js?v=7.2.0"></script><script src="stats-race-data.js?v=4.1.0"></script><script src="pack-pull-play-data.js?v=2.0.0"></script><script src="config.js?v=11.0.0"></script><script>
const checks=document.getElementById('checks');function row(name){const n=document.createElement('div');n.className='check pending';n.innerHTML='<span class="icon">…</span><span><strong>'+name+'</strong><small>Checking…</small></span>';checks.appendChild(n);return n}function set(n,pass,msg){n.className='check '+(pass?'pass':'fail');n.querySelector('.icon').textContent=pass?'✓':'!';n.querySelector('small').textContent=msg}
async function run(){checks.innerHTML='';
 const ppp=window.HOOPLOOP_PPP_DATA||{},pm=ppp.meta||{},pc=ppp.cards||[];
 const pool=row('PPP v2 card pool');set(pool,pm.version==='2.0.0'&&pm.currentCards===534&&pm.teamEraCards===715&&pc.length===1249,`Current cards: ${pm.currentCards||0} · team-era cards: ${pm.teamEraCards||0} · total versions: ${pc.length}.`);
 const ids=row('PPP card IDs');const idSet=new Set(pc.map(c=>c.id));set(ids,idSet.size===pc.length,`${idSet.size.toLocaleString()} unique card IDs found.`);
 const eras=row('Team-tenure versions');const versions=n=>pc.filter(c=>c.name===n);const bron=versions('LeBron James'),kd=versions('Kevin Durant'),shaq=versions('Shaquille O’Neal'),tmac=versions('Tracy McGrady');const has=(a,t)=>a.some(c=>c.team===t);const eraPass=bron.length>=4&&has(bron,'Cleveland Cavaliers')&&has(bron,'Miami Heat')&&has(bron,'Los Angeles Lakers')&&has(kd,'Oklahoma City Thunder')&&shaq.length>=6&&has(tmac,'Orlando Magic')&&has(tmac,'Houston Rockets');set(eras,eraPass,`LeBron: ${bron.length} versions · Durant: ${kd.length} · Shaq: ${shaq.length} · T-Mac: ${tmac.length}.`);
 const wb=row('Version-specific boost eligibility');const wbLal=pc.find(c=>c.name==='Russell Westbrook'&&c.team==='Los Angeles Lakers'),wbOkc=pc.find(c=>c.name==='Russell Westbrook'&&c.team==='Oklahoma City Thunder');set(wb,Boolean(wbLal&&!wbLal.boostEligible&&wbOkc?.boostEligible),'Lakers Westbrook is not boost-eligible; OKC Westbrook is.');
 const group=row('Starter / boost coverage');const count=(g,boost)=>new Set(pc.filter(c=>(c.groups||[]).includes(g)&&(!boost||c.boostEligible)).map(c=>String(c.baseId))).size;const g=count('G',true),f=count('F',true),c=count('C',true);set(group,g>=40&&f>=40&&c>=20,`Boost-eligible identities — G: ${g} · F: ${f} · C: ${c}.`);
 const engine=row('PPP v2 engine');try{const txt=await fetch('pack-pull-play.js?v=2.0.0').then(r=>r.text());const pass=txt.includes("const START_GROUPS=['G','G','F','F','C']")&&txt.includes('const BENCH_MINUTES=[21,19,15,11,9]')&&txt.includes('boostedCards')&&txt.includes('boostCount')&&txt.includes('normalPackProfile')&&txt.includes("return'Perfect'")&&txt.includes('seasonAverages')&&txt.includes('ppp_ready_game');set(engine,pass,pass?'0–3 boosts, card-carried boost color, bench hierarchy, Perfect Season and season stats found.':'pack-pull-play.js is stale.');}catch(e){set(engine,false,e.message)}
 const form=row('PPP v2 interface');try{const txt=await fetch('pack-pull-play.html?v=2.0.0').then(r=>r.text());const pass=txt.includes('0–3 BOOSTS')&&txt.includes('1,249 CARDS')&&txt.includes('No position locks. Bench order controls minutes.')&&txt.includes('season-stats-body')&&txt.includes('Pack.<br><em>Pull. Play.</em>');set(form,pass,pass?'New boost controls, position-free bench, season stat report and cleaned title found.':'pack-pull-play.html is stale.');}catch(e){set(form,false,e.message)}
 const nav=row('Shared navigation');try{const names=['index.html','start-bench-cut.html','cash-grab.html','stats-race.html','hooploopsim.html'];const pages=await Promise.all(names.map(n=>fetch(n).then(r=>r.text())));const pass=pages.every(x=>x.includes('pack-pull-play.html')&&!x.includes('Higher or Lower')&&!x.includes('index.html?open=friends'));set(nav,pass,pass?'Pack, Pull, Play remains in shared navigation and Friends stays out of the game bar.':'At least one shared page has stale navigation.');}catch(e){set(nav,false,e.message)}
 const cg=window.HOOPLOOP_CASH_GRAB_DATA||{},cur=cg.current||[],all=cg.allTime||[];const cash=row('Cash Grab preserved');set(cash,cur.length===192&&all.length===230,`Current: ${cur.length} · All-Time: ${all.length}.`);
 const sr=window.HOOPLOOP_STATS_RACE_DATA||{},ps=sr.players||[];const stats=row('Stats Race preserved');set(stats,ps.length===56,`Stats Race profiles: ${ps.length}.`);
 const cfg=window.HOOPLOOP_CONFIG||{},configured=/^https:\/\/.+\.supabase\.co$/i.test(cfg.SUPABASE_URL||'')&&Boolean(cfg.SUPABASE_ANON_KEY)&&!String(cfg.SUPABASE_ANON_KEY).includes('PASTE_');const config=row('Supabase configuration');set(config,configured,configured?'Project URL and public browser key are present.':'config.js is missing or has placeholders.');if(!configured)return;const client=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
 const pppVersion=row('PPP backend compatibility');try{const{data,error}=await client.rpc('ppp_version');if(error)throw error;set(pppVersion,data==='pack-pull-play-v1',data==='pack-pull-play-v1'?'Existing PPP v1 backend remains compatible — no v2 SQL required.':`Unexpected version: ${data}. Run supabase/pack-pull-play-v1.sql if PPP was never installed.`)}catch(e){set(pppVersion,false,(e.message||String(e))+' Run supabase/pack-pull-play-v1.sql only if PPP v1 was never installed.');}
 const pppTable=row('PPP live series table');try{const{error}=await client.from('ppp_matches').select('status,build_deadline,host_roster,guest_roster,host_plan,guest_plan,host_wins,guest_wins,game_log').limit(1);if(error)throw error;set(pppTable,true,'Existing 5-minute build / best-of-seven table responded.')}catch(e){set(pppTable,false,(e.message||String(e))+' Run supabase/pack-pull-play-v1.sql.');}
 const cashVersion=row('Cash Grab backend');try{const{data,error}=await client.rpc('cash_grab_version');if(error)throw error;set(cashVersion,data==='cash-grab-v5',data==='cash-grab-v5'?'Existing Cash Grab v5 backend remains compatible.':`Unexpected version: ${data}`)}catch(e){set(cashVersion,false,e.message)}
 const statsVersion=row('Stats Race backend');try{const{data,error}=await client.rpc('stats_race_version');if(error)throw error;set(statsVersion,data==='stats-race-v4.1',data==='stats-race-v4.1'?'Stats Race v4.1 answer-storage backend remains installed.':`Unexpected version: ${data}`)}catch(e){set(statsVersion,false,e.message)}
}
document.getElementById('rerun').onclick=run;run();
</script></body></html>
