const box=document.getElementById('checks');function row(n){const e=document.createElement('div');e.className='check pending';e.innerHTML='<div class="icon">…</div><div><strong>'+n+'</strong><small>Running…</small></div>';box.appendChild(e);return e}function set(e,p,m){e.className='check '+(p?'pass':'fail');e.querySelector('.icon').textContent=p?'✓':'!';e.querySelector('small').textContent=m}

e=row('Flagg rookie card');const cf=c.find(x=>x.name==='Cooper Flagg'&&x.team==='Dallas Mavericks'&&x.season==='2025–2026');set(e,!!cf,'Dallas 2025–2026 Cooper Flagg card found.');
e=row('PPP v3.1 engine');try{const t=await fetch('pack-pull-play.js?v=3.1.1').then(r=>r.text());const ok=t.includes("label:['G','G','F','F','C']")&&t.includes('card-team')&&t.includes('card-years')&&t.includes('recentCard');set(e,ok,ok?'Clean starter labels, card hierarchy and recency hook found.':'pack-pull-play.js is stale.')}catch(err){set(e,false,err.message)}

 const recent=row('Recent-season stint repair');const sga=pc.find(c=>c.name==='Shai Gilgeous-Alexander'&&c.team==='Oklahoma City Thunder'),jokic=pc.find(c=>c.name==='Nikola Jokić'&&c.team==='Denver Nuggets');set(recent,sga?.season==='2019–2026'&&jokic?.season==='2015–2026',`SGA OKC: ${sga?.season||'missing'} · Jokic DEN: ${jokic?.season||'missing'}.`);

 const cfg=window.HOOPLOOP_CONFIG||{},ok=/^https:\/\/.+\.supabase\.co$/i.test(cfg.SUPABASE_URL||'')&&cfg.SUPABASE_ANON_KEY;e=row('PPP backend compatibility');if(!ok){set(e,false,'config.js missing/placeholder.');return}try{const s=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY),{data,error}=await s.rpc('ppp_version');if(error)throw error;set(e,data==='pack-pull-play-v1',data==='pack-pull-play-v1'?'Existing PPP v1 backend remains compatible — no SQL update needed.':`Unexpected backend: ${data}`)}catch(err){set(e,false,err.message)}}
