<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HoopLoop Platform 26 Verification</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#17181a;background:#f2f2ef}*{box-sizing:border-box}body{margin:0;padding:28px}main{max-width:920px;margin:auto;background:#fff;border:1px solid #ddd;border-radius:18px;padding:28px}h1{margin:0;font-size:clamp(2.4rem,7vw,4.6rem);letter-spacing:-.06em}.sub{color:#70747a}.check{display:grid;grid-template-columns:26px 1fr;gap:12px;padding:15px 0;border-top:1px solid #e4e4e1}.icon{display:grid;place-items:center;width:25px;height:25px;border-radius:50%;font-weight:900}.pass .icon{background:#18864c;color:#fff}.fail .icon{background:#b8322c;color:#fff}.check small,.check strong{display:block}.check small{color:#6f7379;margin-top:3px}.links{display:flex;gap:14px;flex-wrap:wrap}.links a{color:#111;font-weight:800}</style></head><body><main><h1>Platform 26 Check</h1><p class="sub">Shared HoopLoop design-system and regression checks.</p><div id="checks"></div><p class="links"><a href="index.html">Home</a><a href="stats-race.html">Stats Race</a><a href="pack-pull-play.html">PPP</a></p></main><script>
const box=document.getElementById('checks');function row(n){const d=document.createElement('div');d.className='check';d.innerHTML='<div class="icon">…</div><div><strong>'+n+'</strong><small>Running…</small></div>';box.appendChild(d);return d}function set(d,p,m){d.className='check '+(p?'pass':'fail');d.querySelector('.icon').textContent=p?'✓':'!';d.querySelector('small').textContent=m}
async function run(){
 const files=['index.html','start-bench-cut.html','cash-grab.html','stats-race.html','pack-pull-play.html','hooploopsim.html'];
 const pages=await Promise.all(files.map(f=>fetch(f+'?v=26').then(r=>r.text())));
 let d=row('Shared UI files');try{const [css,js]=await Promise.all([fetch('hooploop-ui.css?v=26').then(r=>r.text()),fetch('hooploop-ui.js?v=26').then(r=>r.text())]);set(d,css.includes('--hl-bg')&&css.includes('.hl-home-games')&&js.includes('hooploop_display_mode'),'Shared light/dark design layer loaded.')}catch(e){set(d,false,e.message)}
 d=row('All six pages use shared shell');set(d,pages.every(x=>x.includes('hooploop-ui.css?v=26.0.0')&&x.includes('hooploop-ui.js?v=26.0.0')),'Homepage + five game pages reference the shared UI layer.');
 d=row('Homepage game hub');set(d,pages[0].includes('hl-home-logo')&&pages[0].includes('hl-game-grid')&&pages[0].includes('Basketball games.'),'Original tiled logo and clean six-game hub found.');
 d=row('Simple navigation');set(d,pages.every(x=>x.includes('index.html#games')&&x.includes('index.html#leaderboard')),'Games / Leaderboard shell is present across the platform.');
 d=row('Game-name-first heroes');set(d,pages[1].includes('>Start, Bench, Cut<')&&pages[2].includes('>Cash Grab<')&&pages[3].includes('>Stats Race<')&&pages[4].includes('>Pack, Pull, Play<')&&pages[5].includes('>HoopLoopSim<'),'Every game leads with its actual name.');
 d=row('Theme controls');set(d,pages.every(x=>x.includes('data-hl-theme-toggle')),'Light/dark toggle is present on every page.');
 d=row('PPP corrected data preserved');try{const t=await fetch('pack-pull-play-data.js?v=3.1.1').then(r=>r.text());set(d,t.includes('2019–2026')&&t.includes('2015–2026'),'Corrected recent-season stint data is still in the package.')}catch(e){set(d,false,e.message)}
}
run();</script></body></html>
