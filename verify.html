<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HoopLoop Version 8 Verification</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#111;background:#f3f1ec}*{box-sizing:border-box}body{margin:0;padding:32px}main{max-width:860px;margin:auto;background:#fff;padding:32px;border-radius:22px;box-shadow:0 22px 70px #0001}h1{font-size:clamp(2.5rem,8vw,5rem);margin:0 0 8px;text-transform:uppercase}.sub{color:#666;line-height:1.6}.check{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:16px 0;border-top:1px solid #ddd}.icon{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;font-weight:900}.pending .icon{background:#eee}.pass .icon{color:#fff;background:#18864c}.fail .icon{color:#fff;background:#bd3328}.check strong,.check small{display:block}.check small{margin-top:4px;color:#666;line-height:1.45}code{padding:2px 5px;background:#eee;border-radius:5px}a{color:#df4c15;font-weight:800}button{padding:12px 16px;border:0;border-radius:9px;background:#ff5a1f;color:#fff;font-weight:900;cursor:pointer}.links{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
  </style>
</head>
<body>
<main>
  <h1>Version 8 Check</h1>
  <p class="sub">This checks both HoopLoop games, your Supabase connection, the original online platform tables, the new Start, Bench, Cut voting function, and Realtime.</p>
  <div id="checks"></div>
  <p class="links"><button id="rerun">Run checks again</button><a href="index.html">Open Name Rush</a><a href="start-bench-cut.html">Open Start, Bench, Cut</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="players-data.js?v=8.0.0"></script>
<script src="sbc-player-data.js?v=8.0.0"></script>
<script src="config.js?v=8.0.0"></script>
<script>
const checks = document.getElementById('checks');
function row(name){const node=document.createElement('div');node.className='check pending';node.innerHTML='<span class="icon">…</span><span><strong>'+name+'</strong><small>Checking…</small></span>';checks.appendChild(node);return node}
function set(node,pass,message){node.className='check '+(pass?'pass':'fail');node.querySelector('.icon').textContent=pass?'✓':'!';node.querySelector('small').textContent=message}
async function run(){checks.innerHTML='';
 const nameRush=row('Name Rush player database'); const nr=window.HOOPLOOP_PLAYER_DATA?.meta; set(nameRush,(nr?.playerCount||0)>=5000,nr?`${nr.playerCount.toLocaleString()} names and ${nr.aliasCount} official former names loaded.`:'players-data.js did not load.');
 const sbc=row('Start, Bench, Cut player pools'); const sm=window.HOOPLOOP_SBC_DATA?.meta; const sbcPass=(sm?.playerCount||0)>=2800&&sm?.allStarCount===466&&(sm?.activeCount||0)>=500; set(sbc,sbcPass,sm?`${sm.playerCount.toLocaleString()} card records: ${sm.activeCount} active, ${sm.allStarCount} All-Stars, and ${sm.randomEligibleCount.toLocaleString()} Random-eligible.`:'sbc-player-data.js did not load.');
 const config=row('Supabase configuration'); const cfg=window.HOOPLOOP_CONFIG||{}; const configured=/^https:\/\/.+\.supabase\.co$/i.test(cfg.SUPABASE_URL||'')&&Boolean(cfg.SUPABASE_ANON_KEY)&&!String(cfg.SUPABASE_ANON_KEY).includes('PASTE_'); set(config,configured,configured?'Project URL and browser key are present.':'Your existing config.js is missing or still contains placeholders.'); if(!configured)return;
 const client=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
 const auth=row('Authentication service'); try{const {error}=await client.auth.getSession();set(auth,!error,error?error.message:'Supabase Auth responded correctly.')}catch(e){set(auth,false,e.message)}
 const tables=row('Version 7 platform tables'); try{for(const name of ['profiles','daily_scores']){const {error}=await client.from(name).select('*',{head:true,count:'exact'}).limit(1);if(error)throw new Error(name+': '+error.message)}set(tables,true,'Profiles and Name Rush score tables are reachable through the Data API.')}catch(e){set(tables,false,e.message+' Confirm the original setup.sql was run.');}
 const sbcRpc=row('Start, Bench, Cut voting'); try{const {data,error}=await client.rpc('get_sbc_daily_results',{p_puzzle_date:'2026-08-02',p_puzzle_signature:'verification-only'});if(error)throw error;set(sbcRpc,Boolean(data&&typeof data.totalVotes!=='undefined'),'The anonymous community-results function responded correctly.')}catch(e){set(sbcRpc,false,(e.message||String(e))+' Run supabase/sbc-v8.sql in the SQL Editor.');}
 const realtime=row('Realtime channel'); let settled=false; const channel=client.channel('hooploop-v8-verify-'+Date.now()).subscribe((status,error)=>{if(settled)return;if(status==='SUBSCRIBED'){settled=true;set(realtime,true,'Realtime WebSocket subscription connected.');client.removeChannel(channel)}else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){settled=true;set(realtime,false,error?.message||status);client.removeChannel(channel)}}); setTimeout(()=>{if(!settled){settled=true;set(realtime,false,'Realtime did not subscribe within 8 seconds.');client.removeChannel(channel)}},8000);
}
document.getElementById('rerun').onclick=run;run();
</script>
</body>
</html>
