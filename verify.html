<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HoopLoop Version 4 Verification</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f3ef;color:#101113;margin:0;padding:32px}main{max-width:800px;margin:auto;background:white;border:1px solid #d9d7d0;border-radius:24px;padding:28px;box-shadow:0 18px 60px rgba(0,0,0,.08)}h1{margin-top:0}.pass{color:#16713a}.fail{color:#b3261e}code{background:#f2f1ed;padding:3px 6px;border-radius:6px}li{margin:9px 0}a{color:#d9480f}button{padding:12px 16px;border:0;border-radius:10px;background:#ff5a1f;color:white;font-weight:700;cursor:pointer}
</style></head><body><main><h1>HoopLoop Version 4 verification</h1><p>This page confirms that GitHub Pages loaded the correct database and scripts.</p><div id="results">Checking…</div><p><a href="index.html">Return to HoopLoop</a></p></main>
<script src="players-data.js?v=4.0.0"></script>
<script>
(function(){
 const data=window.HOOPLOOP_PLAYER_DATA;
 const tests=[];
 const add=(name,ok,detail)=>tests.push({name,ok,detail});
 add('Database file loaded',!!data, data?'Loaded':'Missing players-data.js');
 if(data){
   add('Version is 4.0.0',data.meta.buildVersion==='4.0.0',data.meta.buildVersion||'missing');
   add('Player count is at least 5,108',data.players.length>=5108,data.players.length.toLocaleString());
   const names=new Set(data.players.map(p=>p[3]));
   ['LeBron James','Dwyane Wade','Jahmai Mashack','Tyler Burton','Lucas Williamson','Toby Okani','Bez Mbeng'].forEach(name=>add(name+' exists',names.has(name),name));
   const aliases=new Set(data.officialAliases.map(a=>a.name));
   ['Lew Alcindor','Ron Artest','Enes Kanter'].forEach(name=>add('Alias: '+name,aliases.has(name),name));
 }
 const passed=tests.filter(t=>t.ok).length;
 document.getElementById('results').innerHTML=`<h2 class="${passed===tests.length?'pass':'fail'}">${passed} / ${tests.length} checks passed</h2><ul>${tests.map(t=>`<li class="${t.ok?'pass':'fail'}">${t.ok?'✓':'✕'} <strong>${t.name}</strong> — ${t.detail}</li>`).join('')}</ul>`;
})();
</script></body></html>
