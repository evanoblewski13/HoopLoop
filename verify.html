<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HoopLoop Platform 24 Verification</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#111;background:#f3f1ec}*{box-sizing:border-box}body{margin:0;padding:32px}main{max-width:940px;margin:auto;background:#fff;padding:32px;border-radius:22px;box-shadow:0 22px 70px #0001}h1{font-size:clamp(2.5rem,8vw,5rem);margin:0 0 8px;text-transform:uppercase}.sub{color:#666;line-height:1.6}.check{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:16px 0;border-top:1px solid #ddd}.icon{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;font-weight:900}.pending .icon{background:#eee}.pass .icon{color:#fff;background:#18864c}.fail .icon{color:#fff;background:#bd3328}.check strong,.check small{display:block}.check small{margin-top:4px;color:#666;line-height:1.45}a{color:#df4c15;font-weight:800}button{padding:12px 16px;border:0;border-radius:9px;background:#ff5a1f;color:#fff;font-weight:900;cursor:pointer}.links{display:flex;gap:16px;flex-wrap:wrap;align-items:center}</style></head><body><main><h1>Platform 24 Check</h1><p class="sub">Checks Pack, Pull, Play v3 curation: team-era presentation, playstyle cards, curated pre-90s pool, and current backend compatibility.</p><div id="checks"></div><p class="links"><button id="rerun">Run checks again</button><a href="pack-pull-play.html">Pack, Pull, Play</a><a href="cash-grab.html">Cash Grab</a><a href="stats-race.html">Stats Race</a><a href="index.html">Home</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="pack-pull-play-data.js?v=3.0.0"></script><script>
const box=document.getElementById('checks');
function row(name){const el=document.createElement('div');el.className='check pending';el.innerHTML='<div class="icon">…</div><div><strong>'+name+'</strong><small>Running…</small></div>';box.appendChild(el);return el}
function set(el,pass,msg){el.className='check '+(pass?'pass':'fail');el.querySelector('.icon').textContent=pass?'✓':'!';el.querySelector('small').textContent=msg}
async function run(){box.innerHTML='';
 const ppp=window.HOOPLOOP_PPP_DATA||{},pm=ppp.meta||{},pc=ppp.cards||[];
 const pool=row('PPP v3 card pool');set(pool,pm.version==='3.0.0'&&pc.length>900,`Modern-labelled cards: ${pm.modernCards||0} · team-era cards: ${pm.teamEraCards||0} · total versions: ${pc.length}.`);
 const pre=row('Curated pre-1990 pool');const legacy=pc.filter(c=>{const m=(c.season||'').match(/(19|20)\d{2}/);return m&&Number(m[0])<1990;});const obscure=legacy.filter(c=>!['Wilt Chamberlain','Bill Russell','Larry Bird','Magic Johnson','Michael Jordan','Kareem Abdul-Jabbar','Julius Erving','Moses Malone','Hakeem Olajuwon','Isiah Thomas','Charles Barkley','Karl Malone','John Stockton','Patrick Ewing','David Robinson','George Gervin','Jerry West','Elgin Baylor','Oscar Robertson','Walt Frazier','Clyde Drexler','Dominique Wilkins','Scottie Pippen','James Worthy','Kevin McHale','Robert Parish','Dennis Rodman'].includes(c.name)&&(c.allStars||0)<6);set(pre,obscure.length===0,`Legacy cards kept: ${legacy.length}. Non-iconic pre-1990 leftovers: ${obscure.length}.`);
 const styles=row('Playstyle surface');set(styles,pc.every(c=>typeof c.playstyle==='string'&&c.playstyle.length>0),`Playstyle labels found on ${pc.filter(c=>c.playstyle).length} cards.`);
 const modern=row('Modern card labels');const badCurrent=pc.filter(c=>String(c.versionLabel||'').toUpperCase()==='CURRENT');set(modern,badCurrent.length===0,`Generic CURRENT labels remaining: ${badCurrent.length}.`);
 const stars=row('Version spread on key players');const counts=(n)=>pc.filter(c=>c.name===n).length;set(stars,counts('LeBron James')>=4&&counts('Russell Westbrook')>=5&&counts('James Harden')>=5&&counts('Kevin Durant')>=5,`LeBron ${counts('LeBron James')} · Westbrook ${counts('Russell Westbrook')} · Harden ${counts('James Harden')} · Durant ${counts('Kevin Durant')}.`);
 const engine=row('PPP v3 interface');try{const txt=await fetch('pack-pull-play.js?v=3.0.0').then(r=>r.text());const pass=txt.includes('playstyle')&&txt.includes('seasonAverages')&&txt.includes('boostedCards')&&txt.includes('ppp_ready_game');set(engine,pass,pass?'Playstyle rendering and existing PPP engine hooks found.':'pack-pull-play.js is stale.')}catch(e){set(engine,false,e.message)}
 const html=row('PPP v3 page');try{const txt=await fetch('pack-pull-play.html?v=3.0.0').then(r=>r.text());const pass=txt.includes('0–3 BOOSTS')&&txt.includes('SIMULATED ROLE OUTPUT')&&txt.includes('playstyle');set(html,pass,pass?'Updated hero copy and season report found.':'pack-pull-play.html is stale.')}catch(e){set(html,false,e.message)}
 const cfg=window.HOOPLOOP_CONFIG||{},configured=/^https:\/\/.+\.supabase\.co$/i.test(cfg.SUPABASE_URL||'')&&Boolean(cfg.SUPABASE_ANON_KEY)&&!String(cfg.SUPABASE_ANON_KEY).includes('PASTE_'); const config=row('Supabase configuration'); set(config,configured,configured?'Project URL and public browser key are present.':'config.js is missing or has placeholders.'); if(!configured)return; const client=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
 const pppVersion=row('PPP backend compatibility');try{const{data,error}=await client.rpc('ppp_version');if(error)throw error;set(pppVersion,data==='pack-pull-play-v1',data==='pack-pull-play-v1'?'Existing PPP v1 backend remains compatible — no new SQL required.':`Unexpected version: ${data}.`)}catch(e){set(pppVersion,false,(e.message||String(e))+' Run supabase/pack-pull-play-v1.sql only if PPP was never installed.')}
}
document.getElementById('rerun').onclick=run;run();
</script></body></html>
