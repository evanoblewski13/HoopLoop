<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HoopLoop Platform 16 Verification</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#111;background:#f3f1ec}*{box-sizing:border-box}body{margin:0;padding:32px}main{max-width:920px;margin:auto;background:#fff;padding:32px;border-radius:22px;box-shadow:0 22px 70px #0001}h1{font-size:clamp(2.5rem,8vw,5rem);margin:0 0 8px;text-transform:uppercase}.sub{color:#666;line-height:1.6}.check{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:16px 0;border-top:1px solid #ddd}.icon{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;font-weight:900}.pending .icon{background:#eee}.pass .icon{color:#fff;background:#18864c}.fail .icon{color:#fff;background:#bd3328}.check strong,.check small{display:block}.check small{margin-top:4px;color:#666;line-height:1.45}a{color:#df4c15;font-weight:800}button{padding:12px 16px;border:0;border-radius:9px;background:#ff5a1f;color:#fff;font-weight:900;cursor:pointer}.links{display:flex;gap:16px;flex-wrap:wrap;align-items:center}</style></head><body><main><h1>Platform 16 Check</h1><p class="sub">Checks Stats Race v2 pools, multi-answer scoring hooks, profile counts, navigation, and Supabase migration.</p><div id="checks"></div><p class="links"><button id="rerun">Run checks again</button><a href="stats-race.html">Stats Race</a><a href="index.html">Home</a></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="stats-race-data.js?v=2.0.0"></script><script src="config.js?v=11.0.0"></script><script>
const checks=document.getElementById('checks');function row(name){const n=document.createElement('div');n.className='check pending';n.innerHTML='<span class="icon">…</span><span><strong>'+name+'</strong><small>Checking…</small></span>';checks.appendChild(n);return n}function set(n,pass,msg){n.className='check '+(pass?'pass':'fail');n.querySelector('.icon').textContent=pass?'✓':'!';n.querySelector('small').textContent=msg}
async function run(){checks.innerHTML='';
 const dataRow=row('Stats Race v2 profile pools');const sr=window.HOOPLOOP_STATS_RACE_DATA||{};const ps=sr.players||[],ret=ps.filter(p=>p.pool==='retired'),cur=ps.filter(p=>p.pool==='current');const unique=new Set(ps.map(p=>p.id));set(dataRow,ret.length===40&&cur.length===16&&unique.size===56&&sr.meta?.version==='2.0.0',`Retired: ${ret.length} · Current: ${cur.length} · Total: ${ps.length}.`);
 const multi=row('Multi-answer data');const mj=ps.find(p=>p.id==='michael-jordan'),shaq=ps.find(p=>p.id==='shaquille-oneal');set(multi,JSON.stringify(mj?.jerseyNumbers)==='[23,45]'&&shaq?.teams?.length===6,'Jordan #23/#45 and Shaq six-team history found.');
 const engine=row('Stats Race v2 engine');try{const txt=await fetch('stats-race.js?v=2.0.0').then(r=>r.text());const pass=txt.includes('multiNumberScore')&&txt.includes('multiTeamScore')&&txt.includes('stats_race_start_daily_v2')&&txt.includes('stats_race_find_random_match_v2')&&(txt.includes("pool:'retired'")||txt.includes('pool:"retired"')||txt.includes("state.pool='retired'"));set(engine,pass,pass?'Pool-aware multi-answer scoring and v2 online hooks found.':'stats-race.js is stale.');}catch(e){set(engine,false,e.message)}
 const form=row('Current / retired report fields');try{const txt=await fetch('stats-race.html?v=2.0.0').then(r=>r.text());const pass=txt.includes('data-pool="retired"')&&txt.includes('data-pool="current"')&&txt.includes('id="teams"')&&txt.includes('id="careerHighPoints"');set(form,pass,pass?'Pool buttons, teams list, jersey list, and career-high field found.':'Stats Race HTML is stale.');}catch(e){set(form,false,e.message)}
 const nav=row('Platform navigation');try{const names=['index.html','start-bench-cut.html','cash-grab.html','hooploopsim.html'];const pages=await Promise.all(names.map(n=>fetch(n).then(r=>r.text())));const ok=pages.every(t=>t.includes('stats-race.html'));set(nav,ok,ok?'Stats Race remains linked across HoopLoop.':'At least one existing page is missing Stats Race.');}catch(e){set(nav,false,e.message)}
 const cfg=window.HOOPLOOP_CONFIG||{},configured=/^https:\/\/.+\.supabase\.co$/i.test(cfg.SUPABASE_URL||'')&&Boolean(cfg.SUPABASE_ANON_KEY)&&!String(cfg.SUPABASE_ANON_KEY).includes('PASTE_');const config=row('Supabase configuration');set(config,configured,configured?'Project URL and public browser key are present.':'config.js is missing or has placeholders.');if(!configured)return;
 const client=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
 const version=row('Stats Race v2 database migration');try{const{data,error}=await client.rpc('stats_race_version');if(error)throw error;set(version,data==='stats-race-v2',data==='stats-race-v2'?'Stats Race v2 database functions are installed.':`Unexpected version: ${data}`)}catch(e){set(version,false,(e.message||String(e))+' Run supabase/stats-race-v2.sql.');}
 const board=row('Pool-aware Daily leaderboard');try{const parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()),o={};parts.forEach(p=>o[p.type]=p.value);const date=`${o.year}-${o.month}-${o.day}`;const{error}=await client.rpc('stats_race_daily_leaderboard_v2',{p_challenge_date:date,p_pool:'retired'});if(error)throw error;set(board,true,'Retired-pool leaderboard RPC responded.')}catch(e){set(board,false,(e.message||String(e))+' Run stats-race-v2.sql.');}
}
document.getElementById('rerun').onclick=run;run();
</script></body></html>
