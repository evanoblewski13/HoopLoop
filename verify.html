<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HoopLoop Platform 15 Verification</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#111;background:#f3f1ec}*{box-sizing:border-box}body{margin:0;padding:32px}main{max-width:920px;margin:auto;background:#fff;padding:32px;border-radius:22px;box-shadow:0 22px 70px #0001}h1{font-size:clamp(2.5rem,8vw,5rem);margin:0 0 8px;text-transform:uppercase}.sub{color:#666;line-height:1.6}.check{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:16px 0;border-top:1px solid #ddd}.icon{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;font-weight:900}.pending .icon{background:#eee}.pass .icon{color:#fff;background:#18864c}.fail .icon{color:#fff;background:#bd3328}.check strong,.check small{display:block}.check small{margin-top:4px;color:#666;line-height:1.45}code{padding:2px 5px;background:#eee;border-radius:5px}a{color:#df4c15;font-weight:800}button{padding:12px 16px;border:0;border-radius:9px;background:#ff5a1f;color:#fff;font-weight:900;cursor:pointer}.links{display:flex;gap:16px;flex-wrap:wrap;align-items:center}</style></head><body><main><h1>Platform 15 Check</h1><p class="sub">Checks the existing HoopLoop platform plus Stats Race v1: the 17-field scouting report, 90-second timer, partial-credit engine, Daily/Practice/Race modes, founding profile database, and the Stats Race Supabase migration.</p><div id="checks"></div><p class="links"><button id="rerun">Run checks again</button><a href="stats-race.html">Stats Race</a><a href="cash-grab.html">Cash Grab</a><a href="index.html">Name Rush</a><a href="start-bench-cut.html">SBC</a><a href="hooploopsim.html">HoopLoopSim</a></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="players-data.js?v=9.0.0"></script><script src="sbc-player-data.js?v=9.0.0"></script><script src="cash-grab-data.js?v=6.0.0"></script><script src="stats-race-data.js?v=1.0.0"></script><script src="config.js?v=11.0.0"></script><script>
const checks=document.getElementById('checks');function row(name){const n=document.createElement('div');n.className='check pending';n.innerHTML='<span class="icon">…</span><span><strong>'+name+'</strong><small>Checking…</small></span>';checks.appendChild(n);return n}function set(n,pass,msg){n.className='check '+(pass?'pass':'fail');n.querySelector('.icon').textContent=pass?'✓':'!';n.querySelector('small').textContent=msg}
async function run(){checks.innerHTML='';
 const nrRow=row('Name Rush player database');const nr=window.HOOPLOOP_PLAYER_DATA?.meta;set(nrRow,(nr?.playerCount||0)>=5000,nr?`${nr.playerCount.toLocaleString()} names loaded.`:'players-data.js did not load.');
 const sbcRow=row('Start, Bench, Cut database');const sm=window.HOOPLOOP_SBC_DATA?.meta;set(sbcRow,(sm?.playerCount||0)>=2800,sm?`${sm.playerCount.toLocaleString()} SBC cards loaded.`:'sbc-player-data.js did not load.');
 const cgRow=row('Cash Grab Current + All-Time pools');const cg=window.HOOPLOOP_CASH_GRAB_DATA||{};const cur=cg.current||[],all=cg.allTime||[];set(cgRow,cur.length===192&&all.length===230,`Current: ${cur.length} · All-Time: ${all.length}.`);
 const dataRow=row('Stats Race founding profiles');const sr=window.HOOPLOOP_STATS_RACE_DATA||{};const players=sr.players||[];const unique=new Set(players.map(p=>p.id));const required=['heightInches','weight','college','hometown','draftYear','draftPick','championships','mvps','finalsMvps','allStars','games','points','ppg','rpg','apg'];const complete=players.every(p=>required.every(k=>p[k]!==undefined));set(dataRow,players.length===16&&unique.size===16&&complete&&sr.meta?.maxScore===1700&&sr.meta?.timerSeconds===90,`${players.length} founding profiles · ${sr.meta?.maxScore||'?'} max points · ${sr.meta?.timerSeconds||'?'}s clock.`);
 const engine=row('Stats Race v1 game engine');try{const txt=await fetch('stats-race.js?v=1.0.0').then(r=>r.text());const pass=txt.includes('const MAX_SCORE=1700, RACE_MS=90000')&&txt.includes("case'height'")&&txt.includes("case'weight'")&&txt.includes("case'average'")&&txt.includes('scoreAnswers')&&txt.includes('dailyPlayer')&&txt.includes('stats_race_find_random_match')&&txt.includes('stats_race_create_friend_match')&&txt.includes('numericScore');set(engine,pass,pass?'17-field partial-credit scoring, 90-second clock, deterministic Daily player, and online race hooks found.':'stats-race.js is stale or incomplete.');}catch(e){set(engine,false,e.message)}
 const nav=row('Platform navigation');try{const names=['index.html','start-bench-cut.html','cash-grab.html','hooploopsim.html'];const pages=await Promise.all(names.map(n=>fetch(n).then(r=>r.text())));set(nav,pages.every(t=>t.includes('stats-race.html')),pages.every(t=>t.includes('stats-race.html'))?'Stats Race appears in all four existing game navigation surfaces.':'At least one existing page is missing the Stats Race link.');}catch(e){set(nav,false,e.message)}
 const config=row('Supabase configuration');const cfg=window.HOOPLOOP_CONFIG||{};const configured=/^https:\/\/.+\.supabase\.co$/i.test(cfg.SUPABASE_URL||'')&&Boolean(cfg.SUPABASE_ANON_KEY)&&!String(cfg.SUPABASE_ANON_KEY).includes('PASTE_');set(config,configured,configured?'Project URL and public browser key are present.':'config.js is missing or still contains placeholders.');if(!configured)return;
 const client=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
 const auth=row('Authentication service');try{const{error}=await client.auth.getSession();set(auth,!error,error?error.message:'Supabase Auth responded correctly.')}catch(e){set(auth,false,e.message)}
 const version=row('Stats Race database migration');try{const{data,error}=await client.rpc('stats_race_version');if(error)throw error;set(version,data==='stats-race-v1',data==='stats-race-v1'?'Stats Race v1 database functions are installed.':`Unexpected version: ${data}`);}catch(e){set(version,false,(e.message||String(e))+' Run supabase/stats-race-v1.sql.');}
 const board=row('Stats Race leaderboard RPC');try{const parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const po={};parts.forEach(p=>po[p.type]=p.value);const date=`${po.year}-${po.month}-${po.day}`;const{error}=await client.rpc('stats_race_daily_leaderboard',{p_challenge_date:date});if(error)throw error;set(board,true,'Safe Daily leaderboard endpoint responded without exposing report answers.')}catch(e){set(board,false,(e.message||String(e))+' Run supabase/stats-race-v1.sql.');}
 const realtime=row('Realtime channel');let settled=false;const channel=client.channel('hooploop-v15-'+Date.now()).subscribe((status,error)=>{if(settled)return;if(status==='SUBSCRIBED'){settled=true;set(realtime,true,'Realtime WebSocket connected for head-to-head races.');client.removeChannel(channel)}else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){settled=true;set(realtime,false,error?.message||status);client.removeChannel(channel)}});setTimeout(()=>{if(!settled){settled=true;set(realtime,false,'Realtime did not subscribe within 8 seconds.');client.removeChannel(channel)}},8000);
}
document.getElementById('rerun').onclick=run;run();
</script></body></html>
