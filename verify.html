<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Platform 27 Check</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#17181a;background:#f2f2ef}*{box-sizing:border-box}body{margin:0;padding:28px}main{max-width:920px;margin:auto;background:#fff;border:1px solid #ddd;border-radius:16px;padding:28px}.check{display:grid;grid-template-columns:26px 1fr;gap:12px;padding:14px 0;border-top:1px solid #eee}.icon{display:grid;place-items:center;width:24px;height:24px;border-radius:6px;background:#eee;font-weight:900}.pass .icon{background:#18864c;color:white}.fail .icon{background:#b8322c;color:white}.check small,.check strong{display:block}.check small{color:#70747a;margin-top:3px}h1{font-size:clamp(2.4rem,7vw,4.5rem);letter-spacing:-.06em;margin:0}.sub{color:#70747a}.links{display:flex;gap:12px;flex-wrap:wrap}.links a{color:#111;font-weight:800}</style></head><body><main><h1>Platform 27 Check</h1><p class="sub">Standalone home, direct game navigation, dark mode and regression checks.</p><div id="checks"></div><p class="links"><a href="index.html">Home</a><a href="name-rush.html">Name Rush</a><a href="stats-race.html">Stats Race</a><a href="pack-pull-play.html">PPP</a></p></main><script src="pack-pull-play-data.js?v=3.1.1"></script><script>
const box=document.getElementById('checks');function row(n){const d=document.createElement('div');d.className='check';d.innerHTML='<div class="icon">…</div><div><strong>'+n+'</strong><small>Running…</small></div>';box.appendChild(d);return d}function set(d,p,m){d.className='check '+(p?'pass':'fail');d.querySelector('.icon').textContent=p?'✓':'!';d.querySelector('small').textContent=m}
async function run(){box.innerHTML='';let d=row('Standalone homepage');try{const t=await fetch('index.html?v=27').then(r=>r.text());set(d,t.includes('hl-home-only')&&t.includes('name-rush.html')&&!t.includes('id="play-screen"'),'Home is hub-only and Name Rush has its own route.')}catch(e){set(d,false,e.message)}
d=row('Direct game navigation');try{const names=['name-rush.html','stats-race.html','pack-pull-play.html','cash-grab.html','start-bench-cut.html','hooploopsim.html'];const ps=await Promise.all(names.map(n=>fetch(n+'?v=27').then(r=>r.text())));const links=['name-rush.html','stats-race.html','pack-pull-play.html','cash-grab.html','start-bench-cut.html','hooploopsim.html'];set(d,ps.every(t=>links.every(x=>t.includes(x))&&!t.includes('>Leaderboard</a>')),'All six game pages link directly to each other; Leaderboard is not primary nav.')}catch(e){set(d,false,e.message)}
d=row('Shared arcade design layer');try{const t=await fetch('hooploop-ui.css?v=27').then(r=>r.text());set(d,t.includes('PLATFORM 27 — ARCADE COHESION PASS')&&t.includes('.hl-arcade-card')&&t.includes('html[data-hl-mode="dark"]'),'Arcade cards and dark-surface rules found.')}catch(e){set(d,false,e.message)}
d=row('Theme controls');try{const names=['index.html','name-rush.html','stats-race.html','pack-pull-play.html','cash-grab.html','start-bench-cut.html','hooploopsim.html'];const ps=await Promise.all(names.map(n=>fetch(n).then(r=>r.text())));set(d,ps.every(t=>t.includes('data-hl-theme-toggle')),'Theme toggle present across home + all games.')}catch(e){set(d,false,e.message)}
d=row('PPP corrected recent stints');const pc=window.HOOPLOOP_PPP_DATA?.cards||[];const sga=pc.find(c=>c.name==='Shai Gilgeous-Alexander'&&c.team==='Oklahoma City Thunder'),joker=pc.find(c=>c.name==='Nikola Jokic'&&c.team==='Denver Nuggets')||pc.find(c=>c.name==='Nikola Jokić'&&c.team==='Denver Nuggets');set(d,pc.length>=1500&&/2026/.test(sga?.season||sga?.years||sga?.versionLabel||'')&&/2026/.test(joker?.season||joker?.years||joker?.versionLabel||''),`Cards: ${pc.length}. SGA and Jokic/Jokić recent stints checked.`)}run();</script></body></html>
