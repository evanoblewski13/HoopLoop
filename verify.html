<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HoopLoop Platform 21 Verification</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#111;background:#f3f1ec}*{box-sizing:border-box}body{margin:0;padding:32px}main{max-width:940px;margin:auto;background:#fff;padding:32px;border-radius:22px;box-shadow:0 22px 70px #0001}h1{font-size:clamp(2.5rem,8vw,5rem);margin:0 0 8px;text-transform:uppercase}.sub{color:#666;line-height:1.6}.check{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:16px 0;border-top:1px solid #ddd}.icon{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;font-weight:900}.pending .icon{background:#eee}.pass .icon{color:#fff;background:#18864c}.fail .icon{color:#fff;background:#bd3328}.check strong,.check small{display:block}.check small{margin-top:4px;color:#666;line-height:1.45}a{color:#df4c15;font-weight:800}button{padding:12px 16px;border:0;border-radius:9px;background:#ff5a1f;color:#fff;font-weight:900;cursor:pointer}.links{display:flex;gap:16px;flex-wrap:wrap;align-items:center}</style></head><body><main><h1>Platform 21 Check</h1><p class="sub">Checks Cash Grab v7.2 visual/recency polish and Stats Race v4.1 race-answer comparison.</p><div id="checks"></div><p class="links"><button id="rerun">Run checks again</button><a href="cash-grab.html">Cash Grab</a><a href="stats-race.html">Stats Race</a><a href="index.html">Home</a></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="cash-grab-data.js?v=7.2.0"></script><script src="cash-grab-real-data.js?v=7.2.0"></script><script src="stats-race-data.js?v=4.1.0"></script><script src="config.js?v=11.0.0"></script><script>
const checks=document.getElementById('checks');function row(name){const n=document.createElement('div');n.className='check pending';n.innerHTML='<span class="icon">…</span><span><strong>'+name+'</strong><small>Checking…</small></span>';checks.appendChild(n);return n}function set(n,pass,msg){n.className='check '+(pass?'pass':'fail');n.querySelector('.icon').textContent=pass?'✓':'!';n.querySelector('small').textContent=msg}
async function run(){checks.innerHTML='';
 const cg=window.HOOPLOOP_CASH_GRAB_DATA||{},cur=cg.current||[],all=cg.allTime||[],real=window.HOOPLOOP_CASH_GRAB_REAL_DATA||{},m=real.meta||{};
 const pools=row('Cash Grab pools');set(pools,cur.length===192&&all.length===230,`Current: ${cur.length} · All-Time: ${all.length}.`);
 const rec=row('Cash Grab recent-form data');set(rec,m.version==='7.2.0'&&m.currentRecentProfileCount>100&&m.h2hRecentCount>1000,`Recent current baselines: ${m.currentRecentProfileCount||0} · recency-weighted H2H pairs: ${(m.h2hRecentCount||0).toLocaleString()} · half-life: ${m.recencyHalfLifeSeasons||'?'} seasons.`);
 const cashEngine=row('Cash Grab v7.2 engine');try{const txt=await fetch('cash-grab.js?v=7.2.0').then(r=>r.text());const pass=txt.includes('REAL.currentRecentProfiles')&&txt.includes('REAL.h2hRecent')&&txt.includes("sample.recent?sample.effectiveGp:sample.gp")&&!txt.includes('function teamMetrics');set(cashEngine,pass,pass?'Recent-form current baseline + decayed matchup sample found.':'cash-grab.js is stale.');}catch(e){set(cashEngine,false,e.message)}
 const visual=row('Cash Grab stat-sheet polish');try{const css=await fetch('cash-grab.css?v=7.2.0').then(r=>r.text());const pass=css.includes('.match-team-heading span')&&css.includes('background:transparent')&&!css.includes('.box-score tbody tr:last-child td{font-weight:950;background:#faf8f4}');set(visual,pass,pass?'Center-row highlight removed; matchup headers use the accent pill.':'cash-grab.css is stale.');}catch(e){set(visual,false,e.message)}
 const sr=window.HOOPLOOP_STATS_RACE_DATA||{},ps=sr.players||[];const stats=row('Stats Race v4 data');set(stats,ps.length===56&&sr.meta?.version==='4.0.0',`Profiles: ${ps.length} · v4 dossier data preserved.`);
 const srEngine=row('Stats Race opponent answer column');try{const txt=await fetch('stats-race.js?v=4.1.0').then(r=>r.text());const pass=txt.includes("stats_race_submit_match_v4")&&txt.includes('renderRaceComparison')&&txt.includes('guest_answers')&&txt.includes('host_answers');set(srEngine,pass,pass?'Race submissions save answers and final results render You / Opponent / Answer columns.':'stats-race.js is stale.');}catch(e){set(srEngine,false,e.message)}
 const cfg=window.HOOPLOOP_CONFIG||{},configured=/^https:\/\/.+\.supabase\.co$/i.test(cfg.SUPABASE_URL||'')&&Boolean(cfg.SUPABASE_ANON_KEY)&&!String(cfg.SUPABASE_ANON_KEY).includes('PASTE_');const config=row('Supabase configuration');set(config,configured,configured?'Project URL and public browser key are present.':'config.js is missing or has placeholders.');if(!configured)return;const client=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
 const cashVersion=row('Cash Grab backend');try{const{data,error}=await client.rpc('cash_grab_version');if(error)throw error;set(cashVersion,data==='cash-grab-v5',data==='cash-grab-v5'?'Existing Cash Grab v5 backend remains compatible; no Cash Grab SQL needed.':`Unexpected version: ${data}`)}catch(e){set(cashVersion,false,e.message)}
 const statsVersion=row('Stats Race v4.1 backend');try{const{data,error}=await client.rpc('stats_race_version');if(error)throw error;set(statsVersion,data==='stats-race-v4.1',data==='stats-race-v4.1'?'Answer-storage migration installed.':`Unexpected version: ${data}. Run supabase/stats-race-v4.1.sql.`)}catch(e){set(statsVersion,false,(e.message||String(e))+' Run supabase/stats-race-v4.1.sql.');}
 const answerCols=row('Stats Race answer storage');try{const{error}=await client.from('stats_race_matches').select('host_answers,guest_answers').limit(1);if(error)throw error;set(answerCols,true,'Both race answer sheets are available after a completed race.')}catch(e){set(answerCols,false,(e.message||String(e))+' Run supabase/stats-race-v4.1.sql.');}
}
document.getElementById('rerun').onclick=run;run();
</script></body></html>
