<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HoopLoop Platform 20 Verification</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#111;background:#f3f1ec}*{box-sizing:border-box}body{margin:0;padding:32px}main{max-width:940px;margin:auto;background:#fff;padding:32px;border-radius:22px;box-shadow:0 22px 70px #0001}h1{font-size:clamp(2.5rem,8vw,5rem);margin:0 0 8px;text-transform:uppercase}.sub{color:#666;line-height:1.6}.check{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:16px 0;border-top:1px solid #ddd}.icon{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;font-weight:900}.pending .icon{background:#eee}.pass .icon{color:#fff;background:#18864c}.fail .icon{color:#fff;background:#bd3328}.check strong,.check small{display:block}.check small{margin-top:4px;color:#666;line-height:1.45}a{color:#df4c15;font-weight:800}button{padding:12px 16px;border:0;border-radius:9px;background:#ff5a1f;color:#fff;font-weight:900;cursor:pointer}.links{display:flex;gap:16px;flex-wrap:wrap;align-items:center}</style></head><body><main><h1>Platform 20 Check</h1><p class="sub">Checks Cash Grab v7.1 full box scores, defensive assignments, quarter-by-quarter playback, and existing backend compatibility.</p><div id="checks"></div><p class="links"><button id="rerun">Run checks again</button><a href="cash-grab.html">Cash Grab</a><a href="stats-race.html">Stats Race</a><a href="index.html">Home</a></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="cash-grab-data.js?v=7.1.0"></script><script src="cash-grab-real-data.js?v=7.1.0"></script><script src="stats-race-data.js?v=4.0.0"></script><script src="config.js?v=11.0.0"></script><script>
const checks=document.getElementById('checks');function row(name){const n=document.createElement('div');n.className='check pending';n.innerHTML='<span class="icon">…</span><span><strong>'+name+'</strong><small>Checking…</small></span>';checks.appendChild(n);return n}function set(n,pass,msg){n.className='check '+(pass?'pass':'fail');n.querySelector('.icon').textContent=pass?'✓':'!';n.querySelector('small').textContent=msg}
async function run(){checks.innerHTML='';
 const cg=window.HOOPLOOP_CASH_GRAB_DATA||{},cur=cg.current||[],all=cg.allTime||[],real=window.HOOPLOOP_CASH_GRAB_REAL_DATA||{};const tiers=arr=>[1,2,3,4,5].every(price=>{const p=arr.filter(x=>x.price===price);return p.filter(x=>x.group==='G').length>=2&&p.filter(x=>x.group==='F').length>=2&&p.filter(x=>x.group==='C').length>=1});
 const pools=row('Cash Grab player pools');set(pools,cur.length===192&&all.length===230&&tiers(cur)&&tiers(all),`Current: ${cur.length} · All-Time: ${all.length} · board tiers valid: ${tiers(cur)&&tiers(all)?'yes':'no'}.`);
 const clean=row('Synthetic ratings removed');const forbidden=['fit','talent','versatility','scoring','shooting','playmaking','perimeterDefense','rimDefense','rebounding','finishing','athleticism','offBall','usage','archetype'];const hasSynthetic=[...cur,...all].some(p=>forbidden.some(k=>Object.prototype.hasOwnProperty.call(p,k)));set(clean,!hasSynthetic,!hasSynthetic?'Selection data contains identity, position, price, and era only.':'Old synthetic player fields are still present.');
 const realRow=row('Real-data coverage');const m=real.meta||{};set(realRow,m.version==='7.1.0'&&m.profileCount===422&&m.individualBaselineCount===422&&m.allTimePeakSeasonCount===230&&m.fallbackCount===0&&m.h2hCount>=30000&&m.fullBoxScore===true,`Profiles: ${m.profileCount||0} · primary baselines: ${m.individualBaselineCount||0} · All-Time peaks: ${m.allTimePeakSeasonCount||0} · H2H samples: ${(m.h2hCount||0).toLocaleString()} · full box: ${m.fullBoxScore?'yes':'no'}.`);
 const smart=row('Marcus Smart / Kyrie H2H');const sample=real.h2h?.['kyrieirving|marcussmart'];set(smart,Array.isArray(sample)&&sample[0]>=10,Array.isArray(sample)?`Kyrie vs. Smart shared-game sample: ${sample[0]} games · ${sample[1]} PPG · ${sample[2]} RPG · ${sample[3]} APG.`:'Sample missing.');
 const engine=row('Cash Grab v7.1 game engine');try{const txt=await fetch('cash-grab.js?v=7.1.0').then(r=>r.text());const pass=txt.includes('Cash Grab v7.1')&&txt.includes('simulatePlayerLine')&&txt.includes('QUARTER_DELAY=1400')&&txt.includes('<th>OREB</th>')&&txt.includes('<th>STL</th>')&&txt.includes('<th>BLK</th>')&&txt.includes('<th>TO</th>')&&txt.includes('label>DEFEND<select')&&!txt.includes('matchupSummary')&&!txt.includes('setInterval(step,1000)')&&!txt.includes('function teamMetrics');set(engine,pass,pass?'Full box-score engine, defensive assignments, and quarter reveals found.':'cash-grab.js is stale or incomplete.');}catch(e){set(engine,false,e.message)}
 const page=row('Cash Grab v7.1 interface');try{const txt=await fetch('cash-grab.html?v=7.1.0').then(r=>r.text());const pass=txt.includes('cash-grab-real-data.js?v=7.1.0')&&txt.includes('id="simulate-game"')&&txt.includes('Cash Grab v7.1')&&txt.includes('Platform 20')&&!/FIT|TALENT|VERSATILITY|TEAM GRADE/.test(txt);set(page,pass,pass?'Platform 20 Cash Grab interface loaded.':'cash-grab.html is stale.');}catch(e){set(page,false,e.message)}
 const sr=window.HOOPLOOP_STATS_RACE_DATA||{},ps=sr.players||[],ret=ps.filter(p=>p.pool==='retired'),srcur=ps.filter(p=>p.pool==='current');const stats=row('Stats Race v4 preserved');set(stats,ret.length===40&&srcur.length===16&&sr.meta?.version==='4.0.0'&&ps.every(p=>Number.isInteger(p.allNbaTeams)&&Number.isInteger(p.roty)),`Retired: ${ret.length} · Current: ${srcur.length} · ROTY schema: ${ps.every(p=>Number.isInteger(p.roty))?'yes':'no'}.`);
 const nav=row('Platform navigation');try{const names=['index.html','start-bench-cut.html','cash-grab.html','hooploopsim.html'];const pages=await Promise.all(names.map(n=>fetch(n).then(r=>r.text())));const ok=pages.every(t=>t.includes('stats-race.html'));set(nav,ok,ok?'Stats Race remains linked across HoopLoop.':'At least one page is missing Stats Race.');}catch(e){set(nav,false,e.message)}
 const cfg=window.HOOPLOOP_CONFIG||{},configured=/^https:\/\/.+\.supabase\.co$/i.test(cfg.SUPABASE_URL||'')&&Boolean(cfg.SUPABASE_ANON_KEY)&&!String(cfg.SUPABASE_ANON_KEY).includes('PASTE_');const config=row('Supabase configuration');set(config,configured,configured?'Project URL and public browser key are present.':'config.js is missing or has placeholders.');if(!configured)return;const client=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
 const cashVersion=row('Cash Grab backend compatibility');try{const{data,error}=await client.rpc('cash_grab_version');if(error)throw error;set(cashVersion,data==='cash-grab-v5',data==='cash-grab-v5'?'Existing Cash Grab v5 backend is compatible — no v7.1 SQL required.':`Unexpected version: ${data}`);}catch(e){set(cashVersion,false,(e.message||String(e))+' Install the existing Cash Grab v5 backend if this database is behind.');}
 const drafts=row('Snake draft storage');try{const{error}=await client.from('cash_grab_drafts').select('status,pick_number,host_budget,opponent_budget,turn_deadline,host_lineup,opponent_lineup,result').limit(1);if(error)throw error;set(drafts,true,'Draft rooms can store both lineup configurations and the resolved game.')}catch(e){set(drafts,false,(e.message||String(e))+' Run the existing cash-grab-v5.sql migration.');}
 const statsVersion=row('Stats Race backend compatibility');try{const{data,error}=await client.rpc('stats_race_version');if(error)throw error;set(statsVersion,data==='stats-race-v3',data==='stats-race-v3'?'Stats Race v3 backend remains compatible.':`Unexpected version: ${data}`)}catch(e){set(statsVersion,false,(e.message||String(e))+' Install the existing Stats Race v3 backend if needed.');}
}
document.getElementById('rerun').onclick=run;run();
</script></body></html>
